openapi: 3.1.0
info:
  title: bSmart Client API
  version: 1.8.0
  x-native-social-contract: supabase-social.yaml
  description: Versioned research and legacy account contract. Opt-in immutable Supabase research delivery reuses these item models via supabase-content.yaml. Current native Google/Apple login uses Supabase Auth directly; wallet registry is specified in supabase-wallet.yaml and docs/contracts/supabase_account.md. Native Feed and subject-attributed trade totals use supabase-feed.yaml. Provider-managed perpetuals deposits use supabase-funding.yaml.
servers:
  - url: https://api.bsmart.today
security:
  - installationBearer: []
paths:
  /v1/auth/account/deletions:
    post:
      operationId: requestAccountDeletion
      security: [{ accountBearer: [] }]
      description: Pre-production. Requires interactive authentication within five minutes. Revokes every app session on durable acceptance; never deletes device wallet keys. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, statusToken, confirmDeletion, walletRecoveryConfirmed]
              properties:
                id: { type: string, format: uuid }
                statusToken: { type: string, minLength: 32, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$', writeOnly: true }
                confirmDeletion: { type: boolean, const: true }
                walletRecoveryConfirmed: { type: boolean, const: true }
      responses:
        "202":
          description: Durably accepted. Use the pre-persisted ticket to confirm completion, including after a lost response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionStatus' }
        "401": { description: Account deletion not authorized. }
        "409": { description: Fresh provider sign-in required. }
        "422": { description: Invalid or unconfirmed request. }
        "503": { description: Unavailable or acceptance uncertain; query the saved ticket, do not start another request. }
  /v1/auth/account/deletions/{identifier}/status:
    post:
      operationId: getAccountDeletionStatus
      security: [{ installationBearer: [] }]
      description: No-store. Ticket grants status access only and can resume previously accepted work after backoff. Retained 30 days after completion.
      parameters:
        - { in: path, name: identifier, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusToken]
              properties:
                statusToken: { type: string, minLength: 32, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$', writeOnly: true }
      responses:
        "200":
          description: Durable request state, not Google client disconnect or an on-chain withdrawal receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionStatus' }
        "401": { description: Installation authentication required. }
        "404": { description: Unknown, expired or mismatched ticket. }
        "422": { description: Invalid status request. }
        "503": { description: Status unavailable; not confirmation of deletion. }
  /v1/auth/security-events/apple:
    post:
      operationId: receiveAppleSecurityEvent
      security: []
      description: Provider-signed notification, not an installation-authenticated client endpoint. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: { type: string, minLength: 32, maxLength: 16384, writeOnly: true }
      responses:
        "200": { description: Committed or already processed. }
        "400": { description: Invalid provider event. }
        "413": { description: Request too large. }
        "415": { description: Unsupported media or compression. }
        "503": { description: Receiver or verification unavailable; not acknowledged. }
  /v1/auth/security-events/google:
    post:
      operationId: receiveGoogleSecurityEvent
      security: []
      description: Signed RISC SET; no app bearer can authorize revocation. No-store.
      requestBody:
        required: true
        content:
          application/secevent+jwt:
            schema: { type: string, minLength: 32, maxLength: 16384, writeOnly: true }
      responses:
        "202": { description: Empty durable acknowledgement, including duplicates and ignored events. }
        "400": { description: Invalid provider event. }
        "413": { description: Request too large. }
        "415": { description: Unsupported media or compression. }
        "503": { description: Receiver or verification unavailable; not acknowledged. }
  /v1/trade-feed:
    get:
      operationId: getTradeFeed
      description: No-store. Verified opinion-attributed orders with explicit public amount-sharing consent. Source-off returns 503. Partial fills aggregate per order; live pagination.
      parameters:
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
        - { in: query, name: profileId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Newest-first public executions; no wallet or account identifiers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeFeedPage' }
        "401": { description: Installation authentication required. }
        "503": { description: Verified Feed unavailable; not zero trades. }
  /v1/public-traders/{profileId}:
    get:
      operationId: getPublicTrader
      description: No-store. Rechecks current public Feed consent.
      parameters:
        - { in: path, name: profileId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPublicProfile' }
        "401": { description: Installation authentication required. }
        "404": { description: Unknown or private profile. }
        "503": { description: Public profiles unavailable. }
  /v1/opinions/{opinionId}/feed-context:
    get:
      operationId: getTrustedOpinionFeedContext
      security:
        - feedCatalogBearer: []
      description: Server-owned eligible author/opinion projection for the Supabase registrar; never accepts client text or rank. No-store.
      parameters:
        - {in: path, name: opinionId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: authorId, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      responses:
        '200':
          description: Verified catalog excerpt, not an execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartAccountUpdate'}
        '401': {description: Dedicated Feed catalog service authentication required.}
        '404': {description: Author/opinion not eligible.}
  /v1/opinions/{opinionId}/traders:
    get:
      operationId: getOpinionTraders
      description: Distinct real traders attributed before order submission. No-store. Private users count but are not listed. Disabled until independently verified real execution is connected.
      parameters:
        - { in: path, name: opinionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        "200":
          description: Verified count and consented public profiles ordered by latest fill descending.
          content:
            application/json:
              schema:
                type: object
                required: [totalTraders, publicTraders, traders, nextOffset]
                properties:
                  totalTraders: { type: integer, minimum: 0 }
                  publicTraders: { type: integer, minimum: 0 }
                  nextOffset: { type: [integer, 'null'], minimum: 0 }
                  traders:
                    type: array
                    items:
                      type: object
                      required: [id, nickname, avatarURL, side, tradedAt]
                      properties:
                        id: { type: string, format: uuid }
                        nickname: { type: string, maxLength: 28 }
                        avatarURL: { type: [string, 'null'], format: uri }
                        side: { type: string, enum: [long, short] }
                        tradedAt: { type: string, format: date-time }
        "401": { description: Installation authentication required. }
        "503": { description: Real execution statistics unavailable; do not display zero. }
  /v1/auth/wallet:
    get:
      operationId: getTradingWallet
      security: [{ accountBearer: [] }]
      responses:
        "200":
          description: Authoritative owner-address registration; null means unbound. No-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingWalletRegistration" }
        "401": { description: Account sign-in required. }
        "503": { description: Wallet service unavailable. }
    put:
      operationId: bindTradingWallet
      security: [{ accountBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, signature]
              properties:
                challengeId: { type: string, format: uuid }
                signature: { type: string, minLength: 132, maxLength: 132, pattern: '^0x[0-9a-fA-F]{130}$', writeOnly: true }
      responses:
        "200":
          description: Wallet linked; no authority to transfer or trade. No-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingWalletRegistration" }
        "401": { description: Invalid, expired or replayed proof. }
        "409": { description: Account or wallet already has a different binding. }
        "503": { description: Wallet service unavailable. }
  /v1/auth/wallet/challenges:
    post:
      operationId: createTradingWalletChallenge
      security: [{ accountBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address: { type: string, minLength: 42, maxLength: 42, pattern: '^0x[0-9a-f]{40}$' }
      responses:
        "200":
          description: Session-bound, five-minute EIP-191 proof challenge. No-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingWalletChallenge" }
        "401": { description: Account sign-in required. }
        "409": { description: Conflicting wallet binding. }
        "429": { description: Too many active challenges. }
        "503": { description: Wallet service unavailable. }
  /v1/auth/configuration:
    get:
      operationId: getAccountAuthConfiguration
      security: []
      responses:
        "200":
          description: No-store account capabilities; deposits and trading remain disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAuthConfiguration"
  /v1/auth/challenges:
    post:
      operationId: createAccountAuthChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  $ref: "#/components/schemas/AccountIdentityProvider"
      responses:
        "200":
          description: Single-use installation-bound challenge, valid five minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAuthChallenge"
        "401":
          description: Installation authentication required.
        "429":
          description: Too many active challenges.
        "503":
          description: Provider or account service unavailable.
  /v1/auth/sessions:
    post:
      operationId: exchangeAccountIdentityToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, provider, idToken]
              properties:
                challengeId:
                  type: string
                  format: uuid
                expectedAccountId:
                  type: string
                  format: uuid
                  description: Reauthentication only. Must match an existing verified provider identity; never creates or recreates an account. Omit for normal sign-in.
                provider:
                  $ref: "#/components/schemas/AccountIdentityProvider"
                idToken:
                  type: string
                  minLength: 32
                  maxLength: 16384
                  writeOnly: true
                authorizationCode:
                  type: string
                  minLength: 32
                  maxLength: 2048
                  pattern: '^[!-~]+$'
                  writeOnly: true
                  description: Required for Apple native authorization; forbidden for Google. Single-use and never persisted.
                nonce:
                  type: string
                  minLength: 32
                  maxLength: 128
                  pattern: '^[A-Za-z0-9_-]+$'
                  writeOnly: true
                  description: Original challenge nonce, required when providerNonce is present (Supabase Google). Otherwise omit.
              oneOf:
                - properties:
                    provider:
                      enum: [apple]
                  required: [authorizationCode]
                - properties:
                    provider:
                      enum: [google]
                  not:
                    required: [authorizationCode]
      responses:
        "200":
          description: No-store short-lived account session, not a wallet or trading authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAccountSession"
        "401":
          description: Invalid, expired or replayed identity assertion.
        "503":
          description: Account service unavailable.
  /v1/auth/sessions/refresh:
    post:
      operationId: refreshTradingAccountSession
      security:
        - installationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRefreshInput"
      responses:
        "200":
          description: No-store single-use rotation for the same account and installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAccountSession"
        "401":
          description: Expired, replayed or invalid renewal credential. Do not retry.
        "429":
          description: Too early to rotate an unused credential; Retry-After is 60 seconds.
        "503":
          description: Account service unavailable. An uncertain request requires interactive sign-in.
  /v1/auth/sessions/revoke:
    post:
      operationId: revokeTradingAccountSessionFamily
      security:
        - installationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRefreshInput"
      responses:
        "204":
          description: No-store idempotent revocation; unknown and foreign credentials have no effect.
        "503":
          description: Account service unavailable.
  /v1/auth/account:
    get:
      operationId: getTradingAccount
      security:
        - accountBearer: []
      responses:
        "200":
          description: Current verified account, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAccount"
        "401":
          description: Account sign-in required.
        "503":
          description: Account service unavailable.
  /v1/auth/sessions/current:
    delete:
      operationId: revokeCurrentAccountSession
      security:
        - accountBearer: []
      responses:
        "204":
          description: Session revoked. Device wallet keys are not deleted.
        "401":
          description: Account sign-in required.
        "503":
          description: Account service unavailable.
  /v1/installations:
    post:
      operationId: createAnonymousInstallation
      summary: Create or refresh the anonymous installation session used before account login exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationRegistration"
      responses:
        "200":
          description: Anonymous installation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationSession"
        "201":
          description: Newly created anonymous installation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationSession"
  /v1/devices:
    put:
      operationId: putCurrentDevice
      summary: Register or update the current installation's APNs device token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationInput"
      responses:
        "204":
          description: Device registration updated
  /v1/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Return alert delivery preferences for the current installation.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    put:
      operationId: putNotificationPreferences
      summary: Replace alert delivery preferences for the current installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
  /v1/daily-digest:
    get:
      operationId: getDailyDigest
      summary: Return the latest immutable daily portfolio brief for the current installation.
      responses:
        "200":
          description: Latest generated daily digest snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyDigestSnapshot"
        "404":
          description: No daily digest has been generated for this installation yet
  /v1/mr-collie/query:
    post:
      operationId: queryMrCollie
      summary: Ask Mr Collie to explain the current portfolio and ticker evidence using DeepSeek.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MrCollieQuery"
      responses:
        "200":
          description: Evidence-grounded answer with server-validated citations.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` because the response is installation-specific.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MrCollieResponse"
        "429":
          description: Installation request limit reached.
        "502":
          description: DeepSeek returned an unusable response.
        "503":
          description: DeepSeek is not configured or temporarily unavailable.
  /v1/telemetry/events:
    post:
      operationId: postClientTelemetryEvents
      summary: Record a privacy-minimized batch of anonymous product interaction events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientTelemetryBatch"
      responses:
        "202":
          description: Telemetry batch accepted idempotently
  /v1/portfolio:
    get:
      operationId: getPortfolio
      summary: Return the current user's manually entered positions.
      responses:
        "200":
          description: Portfolio positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioPosition"
  /v1/portfolio/history:
    get:
      operationId: getPortfolioHistory
      summary: Return timestamped total portfolio valuation snapshots when brokerage history is available.
      responses:
        "200":
          description: Chronological portfolio valuation snapshots; an empty array means history is unavailable.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioValuePoint"
  /v1/portfolio/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: putPortfolioEntry
      summary: Idempotently create or replace a locally identified manual position or watchlist entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioEntryInput"
      responses:
        "200":
          description: Upserted portfolio entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPosition"
    delete:
      operationId: deletePortfolioEntry
      summary: Delete a manual position or watchlist entry.
      responses:
        "204":
          description: Portfolio entry deleted
  /v1/events:
    get:
      operationId: getInvestmentEvents
      deprecated: true
      summary: Return legacy investment events while clients migrate to /v1/feed.
      responses:
        "200":
          description: Investment events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestmentEvent"
  /v1/feed:
    get:
      operationId: getPortfolioSignals
      summary: Return decision-ready Smart Account and Smart Money signals for the current portfolio.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "304":
          description: Authenticated read model is unchanged; reuse the cached response body.
        "503":
          description: Publication changed during this read; retry shortly.
        "200":
          description: Portfolio signals
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioSignal"
  /v1/signals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPortfolioSignal
      summary: Return one decision-ready portfolio signal with its evidence snapshot.
      responses:
        "200":
          description: Portfolio signal
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSignal"
  /v1/signals/{id}/state:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: putPortfolioSignalState
      summary: Replace the current user's read, saved, ignored, and feedback state for one signal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalUserStateInput"
      responses:
        "200":
          description: Updated signal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalUserState"
  /v1/smart-account-updates:
    get:
      operationId: getSmartAccountUpdates
      summary: Return material view updates from ranked offchain investment creators.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "304":
          description: Authenticated read model is unchanged; reuse the cached response body.
        "503":
          description: Publication changed during this read; retry shortly.
        "200":
          description: Smart Account updates
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartAccountUpdate"
  /v1/smart-accounts/{accountId}/evidence:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSmartAccountEvidence
      summary: Return bounded historical Call evidence for one formally ranked Smart Account.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "304":
          description: Authenticated evidence is unchanged; reuse this URL's cached response body.
        "503":
          description: Publication changed during this read; retry shortly.
        "200":
          description: Recent, representative successful, and representative missed calls.
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartAccountUpdate"
  /v1/smart-money-movements:
    get:
      operationId: getSmartMoneyMovements
      summary: Return material position changes from ranked public onchain accounts.
      parameters:
        - name: ticker
          in: query
          schema: { type: string }
        - name: account_id
          in: query
          schema: { type: string }
        - name: after
          in: query
          description: Return movements strictly newer than this timestamp.
          schema: { type: string, format: date-time }
        - name: before
          in: query
          description: Return movements strictly older than this timestamp for cursor-style history replay.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
      responses:
        "200":
          description: Smart Money movements
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
            X-BSmart-Result-Count:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartMoneyMovement"
  /v1/smart-money/{accountId}/evidence:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSmartMoneyEvidence
      summary: Return up to three representative observed entry markets for one public capital account.
      responses:
        "200":
          description: Representative entry timing with exact-contract Hyperliquid price evidence.
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartMoneyRepresentativeEvidence"
  /v1/research:
    get:
      operationId: getResearchUniverse
      deprecated: true
      summary: Return legacy research summaries while clients migrate to /v1/intelligence.
      responses:
        "200":
          description: Ticker research summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TickerResearch"
  /v1/tickers/{symbol}/research:
    get:
      operationId: getTickerResearch
      deprecated: true
      summary: Return a legacy combined research view for one supported ticker.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticker research summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerResearch"
  /v1/intelligence:
    get:
      operationId: getTickerIntelligenceUniverse
      summary: Return Smart Account and Smart Money intelligence for the supported MVP ticker universe.
      responses:
        "200":
          description: Ticker intelligence snapshots
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TickerIntelligence"
  /v1/tickers/{symbol}/intelligence:
    get:
      operationId: getTickerIntelligence
      summary: Return the current two-source intelligence snapshot for one supported ticker.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticker intelligence snapshot
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerIntelligence"
  /v1/smart-accounts:
    get:
      operationId: getSmartAccounts
      summary: Return ranked offchain investment creators.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "304":
          description: Authenticated read model is unchanged; reuse the cached response body.
        "503":
          description: Publication changed during this read; retry shortly.
        "200":
          description: Smart Account profiles
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartAccountProfile"
  /v1/smart-money:
    get:
      operationId: getSmartMoney
      summary: Return public Hyperliquid tokenized-equity wallet signals.
      responses:
        "200":
          description: Smart Money signals
          headers:
            ETag:
              $ref: "#/components/headers/ReadModelETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartMoneySignal"
components:
  headers:
    ReadModelETag:
      description: Stable hash of the active immutable collection release.
      schema:
        type: string
  securitySchemes:
    feedCatalogBearer:
      type: http
      scheme: bearer
      description: Dedicated server-to-server Feed catalog secret. Never an end-user token.
    accountBearer:
      type: http
      scheme: bearer
      description: Opaque verified account session, distinct from installation authentication.
    installationBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-installation-token
  schemas:
    AccountProfile:
      type: object
      required: [id, username, handle, bio, avatarURL, revision]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1, maxLength: 28 }
        handle: { type: string, pattern: '^[a-z][a-z0-9_]{2,23}$' }
        bio: { type: string, maxLength: 120 }
        avatarURL: { type: [string, 'null'], format: uri }
        revision: { type: integer, minimum: 0 }
    FeedPublicProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, avatarURL]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, minLength: 1, maxLength: 28 }
        handle: { type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{2,23}$' }
        avatarURL: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 120 }
    FeedPublicPortfolio:
      type: object
      additionalProperties: false
      required: [status, perpsEquityUSD, equityAsOf, spotUSDC, positions, history]
      properties:
        status: {type: string, enum: [ready, not_connected]}
        perpsEquityUSD: {type: [string, 'null'], description: Latest Hyperliquid perp portfolio history value; not summed with spot cash.}
        equityAsOf: {type: [integer, 'null'], description: Exchange portfolio sample timestamp in milliseconds.}
        spotUSDC: {type: [string, 'null'], description: HyperCore spot USDC balance, shown separately.}
        positions:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [coin, side, size, valueUSD, entryPriceUSD, unrealizedPnLUSD, returnOnEquity, leverage]
            properties:
              coin: {type: string}
              side: {type: string, enum: [long, short]}
              size: {type: string}
              valueUSD: {type: string}
              entryPriceUSD: {type: [string, 'null']}
              unrealizedPnLUSD: {type: string}
              returnOnEquity: {type: string, description: Exchange ROI ratio, not percent.}
              leverage: {type: integer, minimum: 1}
        history:
          type: object
          required: [day, week, month]
          properties:
            day: {$ref: '#/components/schemas/FeedPublicEquityPoints'}
            week: {$ref: '#/components/schemas/FeedPublicEquityPoints'}
            month: {$ref: '#/components/schemas/FeedPublicEquityPoints'}
    FeedPublicEquityPoints:
      type: array
      maxItems: 121
      items:
        type: object
        required: [at, valueUSD]
        properties:
          at: {type: integer, description: Exchange sample timestamp in milliseconds.}
          valueUSD: {type: string}
    TradeFeedPage:
      type: object
      additionalProperties: false
      required: [items, nextOffset]
      properties:
        nextOffset: { type: [integer, 'null'], minimum: 0 }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TradeFeedItem' }
    PopularOpinionsPage:
      type: object
      required: [items, nextOffset, windowDays]
      properties:
        windowDays: {type: integer, enum: [7]}
        nextOffset: {type: [integer, 'null'], minimum: 0}
        items:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/PopularOpinion'}
    PopularOpinion:
      type: object
      description: Distinct verified users in seven days; latest side per user. No private identities or amounts.
      required: [opinion, totalTraders, longTraders, shortTraders]
      properties:
        opinion: {$ref: '#/components/schemas/SmartAccountUpdate'}
        totalTraders: {type: integer, minimum: 1}
        longTraders: {type: integer, minimum: 0}
        shortTraders: {type: integer, minimum: 0}
    TradeThesis:
      type: object
      additionalProperties: false
      required: [id, body, publishedAt, likeCount, likedByMe]
      properties:
        id: {type: string, format: uuid, description: Same stable ID as the verified trade event.}
        body: {type: string, minLength: 1, maxLength: 1000}
        publishedAt: {type: string, format: date-time}
        likeCount: {type: integer, minimum: 0}
        likedByMe: {type: boolean}
    TradeFeedItem:
      type: object
      additionalProperties: false
      required: [id, trader, opinion, side, notionalUSD, marketCoin, executedAt]
      properties:
        id: { type: string, format: uuid }
        thesis: {anyOf: [{$ref: '#/components/schemas/TradeThesis'}, {type: 'null'}]}
        canLikeThesis: {type: boolean, description: A thesis exists and belongs to another user.}
        canPublishThesis: {type: boolean, description: Authenticated viewer owns this verified event and no thesis exists.}
        trader: { $ref: '#/components/schemas/FeedPublicProfile' }
        opinion: { $ref: '#/components/schemas/SmartAccountUpdate' }
        side: { type: string, enum: [long, short] }
        notionalUSD: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        marketCoin: { type: string, minLength: 1, maxLength: 64 }
        executedAt: { type: string, format: date-time }
    AccountDeletionStatus:
      type: object
      additionalProperties: false
      required: [id, status, requestedAt, completedAt, retryAfterSeconds]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        retryAfterSeconds: { type: integer, minimum: 0, maximum: 3600 }
    TradingWalletRegistration:
      type: object
      additionalProperties: false
      required: [accountId, address]
      properties:
        accountId: { type: string, format: uuid }
        address:
          type: [string, "null"]
          minLength: 42
          maxLength: 42
          pattern: '^0x[0-9a-f]{40}$'
    TradingWalletChallenge:
      type: object
      additionalProperties: false
      required: [id, accountId, address, nonce, issuedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        address: { type: string, minLength: 42, maxLength: 42, pattern: '^0x[0-9a-f]{40}$' }
        nonce: { type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$' }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AccountIdentityProvider:
      type: string
      enum: [apple, google]
    AccountAuthConfiguration:
      type: object
      required: [providers, depositsEnabled, tradingEnabled]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AccountIdentityProvider"
        depositsEnabled:
          type: boolean
          const: false
        tradingEnabled:
          type: boolean
          const: false
    AccountAuthChallenge:
      type: object
      required: [id, nonce, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        nonce:
          type: string
        providerNonce:
          type: [string, 'null']
          description: SHA-256 hex of nonce for native Supabase Google sign-in. Missing/null uses the legacy raw nonce.
        expiresAt:
          type: string
          format: date-time
    TradingAccount:
      type: object
      required: [id, provider]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/AccountIdentityProvider"
    AccountRefreshInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
          writeOnly: true
    TradingAccountSession:
      type: object
      required: [account, accessToken, expiresAt, refreshToken, refreshExpiresAt]
      properties:
        account:
          $ref: "#/components/schemas/TradingAccount"
        refreshToken:
          type: string
          description: Opaque single-use bSmart credential, not an Apple or Google token.
        refreshExpiresAt:
          type: string
          format: date-time
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    InstallationRegistration:
      type: object
      required: [installationId, platform, appVersion, locale, timeZone]
      properties:
        installationId: { type: string, format: uuid }
        platform:
          type: string
          enum: [ios]
        appVersion: { type: string }
        locale: { type: string }
        timeZone: { type: string }
    InstallationSession:
      type: object
      required: [installationId, accessToken, expiresAt]
      properties:
        installationId: { type: string, format: uuid }
        accessToken: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
    DeviceRegistrationInput:
      type: object
      required: [apnsToken, environment, appVersion, locale, timeZone]
      properties:
        apnsToken: { type: string, minLength: 1 }
        environment:
          type: string
          enum: [development, production]
        appVersion: { type: string }
        locale: { type: string }
        timeZone: { type: string }
    ClientTelemetryBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ClientTelemetryEvent"
    ClientTelemetryEvent:
      type: object
      additionalProperties: false
      required: [id, name, occurredAt, context]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          enum:
            - notification_opened
            - daily_digest_opened
            - signal_opened
            - evidence_opened
            - signal_saved
            - signal_ignored
            - signal_feedback
        occurredAt: { type: string, format: date-time }
        signalId: { type: [string, "null"], format: uuid }
        ticker: { type: [string, "null"], maxLength: 16 }
        evidenceId: { type: [string, "null"], format: uuid }
        source:
          type: [string, "null"]
          enum: [smart_account, smart_money, null]
        context:
          type: string
          enum: [push, today, signal_detail, daily_digest, research, opportunity, smart]
    NotificationPreferences:
      type: object
      required:
        [instantAlertsEnabled, dailyDigestEnabled, dailyDigestMinutes, quietHoursEnabled, quietHoursStartMinutes, quietHoursEndMinutes, mutedTickers]
      properties:
        instantAlertsEnabled: { type: boolean }
        dailyDigestEnabled: { type: boolean }
        dailyDigestMinutes: { type: integer, minimum: 0, maximum: 1439 }
        quietHoursEnabled: { type: boolean }
        quietHoursStartMinutes: { type: integer, minimum: 0, maximum: 1439 }
        quietHoursEndMinutes: { type: integer, minimum: 0, maximum: 1439 }
        mutedTickers:
          type: array
          uniqueItems: true
          items: { type: string }
    PortfolioPosition:
      type: object
      required: [id, ticker, companyName, shares, averageCost, currentPrice, entryKind]
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        companyName: { type: string }
        shares: { type: number }
        averageCost: { type: number }
        currentPrice: { type: number }
        entryKind:
          type: string
          enum: [position, watchlist]
        portfolioWeight:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    PortfolioValuePoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number, minimum: 0 }
    PortfolioEntryInput:
      type: object
      required: [ticker, entryKind]
      description: A position requires positive shares or portfolioWeight; watchlist entries ignore holding values.
      properties:
        ticker: { type: string }
        companyName: { type: [string, "null"] }
        entryKind:
          type: string
          enum: [position, watchlist]
        shares:
          type: [number, "null"]
          minimum: 0
        averageCost:
          type: [number, "null"]
          minimum: 0
        portfolioWeight:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    PriceCandle:
      type: object
      required: [day, open, high, low, close, volume]
      properties:
        day: { type: string, format: date }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: integer }
    SmartAccountPriceEvidence:
      type: object
      description: Real daily OHLC context around one time-stamped Smart Account view; it is audit evidence, not proof of causality.
      required: [ticker, viewDay, viewPrice, latestDay, latestPrice, source, candles]
      properties:
        ticker: { type: string }
        viewDay: { type: string, format: date }
        viewPrice: { type: number }
        latestDay: { type: string, format: date }
        latestPrice: { type: number }
        responsePercent: { type: [number, "null"] }
        source: { type: string }
        candles:
          type: array
          items:
            $ref: "#/components/schemas/PriceCandle"
        opinionMarkers:
          type: array
          description: Up to ten Score-positive views; the earliest positive anchor first, then the highest-contributing remaining views.
          items:
            $ref: "#/components/schemas/SmartAccountOpinionMarker"
    SmartAccountOpinionMarker:
      type: object
      required: [id, publishedAt, viewDay, viewPrice, direction, contribution, horizon, thesis]
      properties:
        id: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
        viewDay: { type: string, format: date }
        viewPrice: { type: number }
        direction:
          type: string
          enum: [bullish, neutral, bearish, mixed]
        contribution:
          type: number
          exclusiveMinimum: 0
        horizon: { type: string }
        thesis: { type: string }
        evidenceURL: { type: [string, "null"], format: uri }
    SmartAccountFirstOpinion:
      type: object
      description: Earliest settled Score-positive view for this platform, author and representative ticker, not a lifetime-first claim. Price is a completed daily close known before publication, never a later entry price.
      required: [publishedAt, direction, priceBasis]
      properties:
        publishedAt: { type: string, format: date-time }
        direction: { type: string, enum: [bullish, bearish] }
        price: { type: [number, "null"], exclusiveMinimum: 0 }
        priceDay: { type: [string, "null"], format: date }
        priceSource: { type: [string, "null"] }
        priceBasis: { type: string, enum: [last_completed_daily_close] }
        sourcePostId: { type: [string, "null"] }
        evidenceURL: { type: [string, "null"], format: uri }
    SmartAccountRepresentativeIntro:
      type: object
      description: Lightweight first-ranked representative ticker and its earliest Score-positive call, without candles or full text. Publication, direction and stock return belong to that same call; ticker contribution ranking is unchanged.
      required: [evidenceId, authorId, platform, ticker, direction, publishedAt, horizon]
      properties:
        evidenceId: { type: string, format: uuid }
        authorId: { type: string }
        platform: { type: string }
        ticker: { type: string }
        direction: { type: string, enum: [bullish, bearish] }
        publishedAt: { type: string, format: date-time }
        horizon: { type: string }
        stockReturnPercent: { type: [number, "null"] }
        firstOpinion: { $ref: "#/components/schemas/SmartAccountFirstOpinion" }
        entryDay: { type: [string, "null"], format: date }
        entryPrice: { type: [number, "null"], exclusiveMinimum: 0 }
        exitDay: { type: [string, "null"], format: date }
    SmartAccountSettlementEvidence:
      type: object
      description: Direction-aware historical settlement against both the S&P 500 and the mapped industry ETF.
      required: [status, horizon]
      properties:
        status: { type: string, enum: [pending, settled, unavailable] }
        horizon: { type: string }
        entryDay: { type: [string, "null"], format: date }
        exitDay: { type: [string, "null"], format: date }
        entryPrice: { type: [number, "null"] }
        exitPrice: { type: [number, "null"] }
        tickerReturnPercent: { type: [number, "null"] }
        marketBenchmarkReturnPercent: { type: [number, "null"] }
        marketExcessReturnPercent: { type: [number, "null"] }
        actualHit: { type: [boolean, "null"] }
        contribution: { type: [number, "null"] }
        industryBenchmarkTicker: { type: [string, "null"] }
        industryBenchmarkReturnPercent: { type: [number, "null"] }
        industryExcessReturnPercent: { type: [number, "null"] }
        industryActualHit: { type: [boolean, "null"] }
        settlementVersion: { type: [string, "null"] }
    OpinionSupportingSource:
      type: object
      required: [id, eventId, ticker, publisher, sourceType, relationship, status, title, summary, publishedAt, sourceURL, claim, excerpt, locator]
      properties:
        id: { type: string }
        eventId: { type: string }
        ticker: { type: string }
        publisher: { type: string }
        sourceType:
          type: string
          enum: [company, regulatory, news, research, data, other]
        relationship:
          type: string
          enum: [cited, related, follow_up]
        status:
          type: string
          enum: [ready, withdrawn]
        title: { type: string }
        titleZH: { type: [string, "null"] }
        summary: { type: string }
        summaryZH: { type: [string, "null"] }
        publishedAt: { type: string, format: date-time }
        sourceURL: { type: string, format: uri, pattern: '^https://' }
        claim: { type: string }
        excerpt: { type: string }
        locator: { type: string }
        contextNote: { type: [string, "null"] }
        contextNoteZH: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    SmartAccountUpdate:
      type: object
      required:
        [id, ticker, companyName, authorId, authorName, platform, score, platformPercentile, direction, lifecycle, horizon, thesis, publishedAt]
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        companyName: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        platform: { type: string }
        score: { type: number }
        platformPercentile:
          type: number
          minimum: 0
          maximum: 1
        direction:
          type: string
          enum: [bullish, neutral, bearish, mixed]
        lifecycle:
          type: string
          enum: [new, strengthened, weakened, reversed, closed, invalidated]
        horizon: { type: string }
        targetPrice: { type: [number, "null"] }
        thesis: { type: string }
        invalidation: { type: [string, "null"] }
        publishedAt: { type: string, format: date-time }
        sourcePostId: { type: [string, "null"] }
        sourceURL: { type: [string, "null"], format: uri }
        ingestedAt: { type: [string, "null"], format: date-time }
        processedAt: { type: [string, "null"], format: date-time }
        evidenceURL: { type: [string, "null"], format: uri }
        authorAvatarURL: { type: [string, "null"], format: uri }
        authorFollowersCount: { type: [integer, "null"], minimum: 0 }
        authorVerified: { type: [boolean, "null"] }
        originalText: { type: [string, "null"] }
        imageURLs:
          description: Verified source-post photos hosted in public opinion media storage.
          type: [array, "null"]
          maxItems: 4
          items: { type: string, format: uri }
        translatedText: { type: [string, "null"] }
        translatedTextZH: { type: [string, "null"] }
        translatedTextEN: { type: [string, "null"] }
        evidenceSpan: { type: [string, "null"] }
        authorScoreAsOf: { type: [string, "null"], format: date-time }
        callScoringVersion: { type: [string, "null"] }
        activityTitle: { type: [string, "null"] }
        activityTitleZH: { type: [string, "null"] }
        activityTitleEN: { type: [string, "null"] }
        supportingSources:
          description: Factual context only; absent or empty means no module. Does not affect Score.
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/OpinionSupportingSource"
        evidenceRole:
          type: [string, "null"]
          enum: [latest, strongest, counterexample, representative, null]
        representativeTickerContribution: { type: [number, "null"] }
        representativeCallCount: { type: [integer, "null"], minimum: 1 }
        representativeTickerRank: { type: [integer, "null"], minimum: 1, maximum: 3 }
        firstOpinion: { $ref: "#/components/schemas/SmartAccountFirstOpinion" }
        settlement:
          anyOf:
            - $ref: "#/components/schemas/SmartAccountSettlementEvidence"
            - type: "null"
        priceEvidence:
          anyOf:
            - $ref: "#/components/schemas/SmartAccountPriceEvidence"
            - type: "null"
    SmartMoneyMovement:
      type: object
      required:
        [id, ticker, companyName, accountId, accountLabel, accountScore, market, action, direction, notionalBefore, notionalAfter, notionalChange, observedAt]
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        companyName: { type: string }
        accountId: { type: string }
        accountLabel: { type: string }
        accountDisplayName: { type: string }
        avatarVariant: { type: integer, minimum: 1, maximum: 54 }
        accountScore: { type: number }
        market: { type: string }
        action:
          type: string
          enum: [opened, increased, reduced, closed, flipped]
        direction:
          type: string
          enum: [bullish, neutral, bearish, mixed]
        notionalBefore: { type: number }
        notionalAfter: { type: number }
        notionalChange: { type: number }
        leverage: { type: [number, "null"] }
        observedAt: { type: string, format: date-time }
        evidenceURL: { type: [string, "null"], format: uri }
        price: { type: [number, "null"] }
        sizeBefore: { type: [number, "null"] }
        sizeAfter: { type: [number, "null"] }
    SmartMoneyRepresentativeEvidence:
      type: object
      required: [id, accountId, accountDisplayName, ticker, market, representativeRank, cumulativeEntryNotional, entryCount, assetNetPnl, latestEntryAt, priceEvidence]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string }
        accountDisplayName: { type: string }
        avatarVariant: { type: [integer, "null"], minimum: 1, maximum: 54 }
        ticker: { type: string }
        market: { type: string }
        representativeRank: { type: integer, minimum: 1, maximum: 3 }
        cumulativeEntryNotional: { type: number, minimum: 0 }
        entryCount: { type: integer, minimum: 1 }
        assetNetPnl: { type: number }
        latestEntryAt: { type: string, format: date-time }
        priceEvidence:
          $ref: "#/components/schemas/SmartMoneyPriceEvidence"
    SmartMoneyPriceEvidence:
      type: object
      required: [market, interval, source, candles, entryMarkers]
      properties:
        market: { type: string }
        interval: { type: string, enum: [4h] }
        source: { type: string }
        candles:
          type: array
          items:
            $ref: "#/components/schemas/SmartMoneyCandle"
        entryMarkers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/SmartMoneyEntryMarker"
    SmartMoneyCandle:
      type: object
      required: [timestamp, open, high, low, close, volume]
      properties:
        timestamp: { type: string, format: date-time }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
    SmartMoneyEntryMarker:
      type: object
      required: [id, observedAt, price, priceBasis, direction, action, entryNotional]
      properties:
        id: { type: string, format: uuid }
