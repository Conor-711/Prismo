openapi: 3.1.0
info:
  title: bSmart Supabase Wallet Registry
  version: 1.0.0
  description: Public wallet addresses only. No private keys, recovery phrases or transactions. Authentication is Supabase Auth, not the research API.
servers:
  - url: https://dzyitinagewdfkzjkuiz.supabase.co/functions/v1
security:
  - supabaseUser: []
    publishableKey: []
paths:
  /bsmart-wallet:
    get:
      operationId: getSupabaseWallet
      responses:
        '200':
          description: Authoritative registration; address null means unbound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { description: Invalid user session. }
        '503': { description: Registry unavailable, not an unbound wallet. }
    put:
      operationId: bindSupabaseWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, signature]
              properties:
                challengeId: { type: string, format: uuid }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$', writeOnly: true }
      responses:
        '200':
          description: Proof consumed and immutable address committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { description: Invalid user session. }
        '409': { description: Address or account already bound differently; recover existing wallet. }
        '422': { description: Expired, replayed, mismatched or invalid proof. }
        '503': { description: Registry unavailable; query before retry. }
  /bsmart-wallet/challenges:
    post:
      operationId: createSupabaseWalletChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address: { $ref: '#/components/schemas/Address' }
      responses:
        '200':
          description: Five-minute account/access-token-bound challenge, replacing the previous pending challenge.
          content:
            application/json:
              schema:
                type: object
                required: [id, accountId, address, nonce, issuedAt, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  address: { $ref: '#/components/schemas/Address' }
                  nonce: { type: string, pattern: '^[0-9a-f]{64}$' }
                  issuedAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
        '401': { description: Invalid user session. }
        '409': { description: Existing wallet differs; recover instead. }
        '429': { description: Challenge requests too frequent. }
        '503': { description: Registry unavailable. }
components:
  securitySchemes:
    supabaseUser: { type: http, scheme: bearer, bearerFormat: JWT }
    publishableKey: { type: apiKey, in: header, name: apikey }
  schemas:
    Address:
      type: string
      pattern: '^0x[0-9a-f]{40}$'
      not: { const: '0x0000000000000000000000000000000000000000' }
    Wallet:
      type: object
      required: [accountId, address]
      properties:
        accountId: { type: string, format: uuid }
        address:
          oneOf:
            - { $ref: '#/components/schemas/Address' }
            - { type: 'null' }
