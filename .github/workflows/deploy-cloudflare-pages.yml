name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_BUILD_CPUS: "1"
      NEXT_PUBLIC_SITE_URL: https://bsmart.today
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore deployment database
        run: |
          test -s data/dev.db.xz.parts
          xargs cat < data/dev.db.xz.parts | xz -dc > data/dev.db
          test -s data/dev.db

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Deploy production site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e4acb581e319df8ec62a74f349202782
          command: pages deploy web/out --project-name=bsmart --branch=main
