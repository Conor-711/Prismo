<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bSmart iOS UI / UX Directions</title>
  <meta name="description" content="bSmart iOS 三套可交互 UI / UX 方向评审原型">
  <link rel="icon" href="../../../../web/public/icon-192.png">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --page: #090c0b;
      --page-2: #0d1110;
      --line: #222927;
      --text: #f4f7f6;
      --muted: #8f9996;
      --soft: #151a18;
      --brand: #57dfbd;
      --danger: #ff6275;
      --warning: #f4b844;
      --blue: #75a9ff;
      --radius: 8px;
      --ease: 210ms cubic-bezier(.2,.75,.2,1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      font-synthesis: none;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--page);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    .review-shell { min-height: 100vh; }

    .review-header {
      min-height: 76px;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      background: #0b0e0d;
    }
    .brand-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 38px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--brand);
      color: #07110e;
      font-size: 21px;
      font-weight: 900;
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 15px; }
    .brand-copy span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .prototype-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1px solid #34403c;
      border-radius: 999px;
      color: #c8d1ce;
      background: #111715;
    }
    .prototype-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }

    .control-band {
      padding: 14px 28px;
      display: grid;
      grid-template-columns: minmax(420px, 1.25fr) minmax(360px, 1fr) auto;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--page-2);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .control-group { min-width: 0; }
    .control-label {
      display: block;
      margin-bottom: 7px;
      color: #6f7a76;
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
    }
    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      padding: 3px;
      border: 1px solid #29302e;
      border-radius: 8px;
      background: #0a0d0c;
    }
    .segmented button {
      min-height: 37px;
      padding: 7px 11px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #87918e;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: color var(--ease), background var(--ease);
      white-space: nowrap;
    }
    .segmented button:hover { color: var(--text); background: #141a18; }
    .segmented button.active { color: #07110e; background: var(--brand); }
    .scheme-switch button { text-align: left; }
    .scheme-switch button.active { color: var(--text); background: #1a211f; box-shadow: inset 0 0 0 1px #3d4c47; }
    .scheme-switch button.active::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--scheme-dot, var(--brand));
    }
    .scheme-switch button[data-scheme="pulse"] { --scheme-dot: #d5ff45; }
    .scheme-switch button[data-scheme="grid"] { --scheme-dot: #5bd9be; }
    .scheme-switch button[data-scheme="brief"] { --scheme-dot: #8eb5ff; }
    .layout-toggle {
      min-height: 39px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid #2b3431;
      border-radius: 7px;
      background: #121715;
      color: #c5cecb;
      cursor: pointer;
      white-space: nowrap;
    }
    .layout-toggle:hover { border-color: #52605b; }
    .layout-toggle svg { width: 16px; }

    .stage {
      min-height: calc(100vh - 146px);
      padding: 30px 28px 52px;
      background-color: #090c0b;
      background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .stage-heading {
      max-width: 1540px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
    }
    .stage-heading h1 { margin: 0; font-size: 20px; line-height: 1.2; }
    .stage-heading p { max-width: 680px; margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .screen-hint { color: #65706c; font-size: 11px; }

    .prototype-grid {
      max-width: 1540px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }
    .prototype-grid.focus { grid-template-columns: minmax(410px, .75fr) minmax(380px, 1.25fr); max-width: 1160px; }
    .direction-column { min-width: 0; }
    .direction-heading {
      min-height: 64px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .direction-heading h2 { margin: 0; font-size: 16px; }
    .direction-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .direction-number { color: #3f4a46; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .phone-wrap { display: flex; justify-content: center; }
    .phone {
      --phone-bg: #090b0b;
      --phone-surface: #121514;
      --phone-surface-2: #181c1b;
      --phone-line: #262c2a;
      --phone-text: #f5f7f6;
      --phone-muted: #87908d;
      --phone-accent: #d4ff44;
      --phone-accent-ink: #0b1008;
      --phone-danger: #ff5c72;
      --phone-warning: #f2b847;
      width: min(100%, 390px);
      height: 844px;
      overflow: hidden;
      position: relative;
      border: 1px solid #39413f;
      border-radius: 42px;
      color: var(--phone-text);
      background: var(--phone-bg);
      box-shadow: 0 26px 70px rgba(0,0,0,.34);
      transition: background var(--ease), color var(--ease);
    }
    .phone[data-scheme="grid"] {
      --phone-bg: #0d1213;
      --phone-surface: #141a1b;
      --phone-surface-2: #192122;
      --phone-line: #293334;
      --phone-text: #ecf2f0;
      --phone-muted: #8c9996;
      --phone-accent: #58d7bb;
      --phone-accent-ink: #07110f;
      --phone-danger: #ff677a;
      --phone-warning: #efb74b;
    }
    .phone[data-scheme="brief"] {
      color-scheme: light;
      --phone-bg: #f4f7f6;
      --phone-surface: #ffffff;
      --phone-surface-2: #edf2f0;
      --phone-line: #d8dfdc;
      --phone-text: #14201d;
      --phone-muted: #697572;
      --phone-accent: #147866;
      --phone-accent-ink: #ffffff;
      --phone-danger: #c84256;
      --phone-warning: #966917;
      border-color: #c7cfcc;
      box-shadow: 0 26px 70px rgba(0,0,0,.2);
    }
    .phone::before {
      content: "";
      position: absolute;
      z-index: 8;
      top: 8px;
      left: 50%;
      width: 106px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 18px;
      background: #030404;
    }
    .status-bar {
      height: 44px;
      padding: 13px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 9;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .status-icons i { display: block; width: 12px; height: 7px; border-radius: 2px; background: currentColor; opacity: .9; }
    .status-icons i:nth-child(1) { width: 10px; clip-path: polygon(0 100%,20% 70%,40% 50%,60% 30%,80% 12%,100% 0,100% 100%); }
    .status-icons i:nth-child(2) { width: 9px; border-radius: 50% 50% 2px 2px; }
    .screen {
      height: calc(100% - 44px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) 70px;
    }
    .screen-scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .screen-scroll::-webkit-scrollbar { display: none; }
    .phone-page { min-height: 100%; padding: 12px 16px 28px; }
    .app-bar {
      min-height: 42px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .app-bar h3 { margin: 0; font-size: 23px; line-height: 1.1; }
    .app-bar p { margin: 4px 0 0; color: var(--phone-muted); font-size: 11px; }
    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--phone-line);
      border-radius: 50%;
      background: var(--phone-surface);
      color: var(--phone-text);
      cursor: pointer;
    }
    .icon-button svg { width: 17px; height: 17px; }
    .eyebrow { color: var(--phone-accent); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .section-title {
      margin: 20px 0 10px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }
    .section-title h4 { margin: 0; font-size: 14px; }
    .section-title span { color: var(--phone-muted); font-size: 10px; }
    .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border: 1px solid var(--phone-line); border-radius: 8px; overflow: hidden; }
    .metric { min-width: 0; padding: 10px; background: var(--phone-surface); }
    .metric span { display: block; color: var(--phone-muted); font-size: 9px; }
    .metric strong { display: block; margin-top: 5px; font-size: 15px; font-variant-numeric: tabular-nums; }
    .positive { color: var(--phone-accent) !important; }
    .negative { color: var(--phone-danger) !important; }
    .warning { color: var(--phone-warning) !important; }

    .pulse-hero {
      padding: 15px;
      border: 1px solid #52691d;
      border-radius: 8px;
      background: var(--phone-surface);
      box-shadow: inset 3px 0 0 var(--phone-accent);
      cursor: pointer;
    }
    .event-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--phone-muted); font-size: 10px; }
    .event-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .severity-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--phone-danger); }
    .pulse-hero h4 { margin: 10px 0 7px; font-size: 20px; line-height: 1.25; }
    .pulse-hero p { margin: 0; color: #b5bfbc; font-size: 12px; line-height: 1.5; }
    .phone[data-scheme="brief"] .pulse-hero p { color: var(--phone-muted); }
    .impact-strip {
      margin-top: 13px;
      padding-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--phone-line);
      font-size: 10px;
    }
    .impact-strip strong { font-size: 11px; }
    .avatar-stack { display: flex; align-items: center; }
    .avatar {
      width: 27px;
      height: 27px;
      border: 2px solid var(--phone-surface);
      border-radius: 50%;
      object-fit: cover;
      background: #29322f;
    }
    .avatar + .avatar { margin-left: -8px; }
    .event-list { display: grid; gap: 0; border-top: 1px solid var(--phone-line); }
    .event-row {
      width: 100%;
      min-height: 78px;
      padding: 12px 1px;
      display: grid;
      grid-template-columns: 34px minmax(0,1fr) auto;
      gap: 10px;
      align-items: start;
      border: 0;
      border-bottom: 1px solid var(--phone-line);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .ticker-mark {
      width: 34px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--phone-surface-2);
      color: var(--phone-text);
      font-size: 10px;
      font-weight: 850;
    }
    .event-row h5 { margin: 0; font-size: 12px; line-height: 1.35; }
    .event-row p { margin: 5px 0 0; color: var(--phone-muted); font-size: 10px; line-height: 1.4; }
    .event-row time { padding-top: 2px; color: var(--phone-muted); font-size: 9px; }
    .relation-pill, .small-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      padding: 3px 7px;
      border: 1px solid var(--phone-line);
      border-radius: 999px;
      color: var(--phone-muted);
      font-size: 9px;
      font-weight: 650;
      background: var(--phone-surface);
    }
    .relation-pill.confirm { color: var(--phone-accent); border-color: color-mix(in srgb, var(--phone-accent) 45%, var(--phone-line)); }
    .relation-pill.diverge { color: var(--phone-warning); border-color: color-mix(in srgb, var(--phone-warning) 45%, var(--phone-line)); }

    .evidence-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .evidence-cell {
      min-height: 98px;
      padding: 12px;
      border: 1px solid var(--phone-line);
      border-radius: 8px;
      background: var(--phone-surface);
    }
    .evidence-cell header { display: flex; align-items: center; justify-content: space-between; color: var(--phone-muted); font-size: 9px; }
    .evidence-cell header svg { width: 14px; }
    .evidence-cell strong { display: block; margin-top: 12px; font-size: 18px; }
    .evidence-cell p { margin: 5px 0 0; color: var(--phone-muted); font-size: 9px; line-height: 1.35; }
    .timeline { margin: 6px 0 0 8px; padding-left: 18px; border-left: 1px solid var(--phone-line); }
    .timeline-item { position: relative; padding: 3px 0 16px; }
    .timeline-item::before { content: ""; position: absolute; left: -22px; top: 6px; width: 7px; height: 7px; border: 2px solid var(--phone-bg); border-radius: 50%; background: var(--phone-accent); }
    .timeline-item.risk::before { background: var(--phone-danger); }
    .timeline-item small { color: var(--phone-muted); font-size: 9px; }
    .timeline-item h5 { margin: 5px 0 3px; font-size: 12px; }
    .timeline-item p { margin: 0; color: var(--phone-muted); font-size: 10px; line-height: 1.4; }

    .brief-date { color: var(--phone-muted); font: 650 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .brief-lead { padding: 8px 0 16px; border-bottom: 1px solid var(--phone-line); cursor: pointer; }
    .brief-lead h4 { margin: 9px 0 9px; font-family: ui-serif, Georgia, "Songti SC", serif; font-size: 25px; line-height: 1.16; }
    .brief-lead > p { margin: 0; color: var(--phone-muted); font-family: ui-serif, Georgia, "Songti SC", serif; font-size: 13px; line-height: 1.58; }
    .brief-signal {
      margin-top: 14px;
      padding: 10px 0 0 12px;
      border-left: 3px solid var(--phone-accent);
      color: var(--phone-text);
      font-size: 10px;
      line-height: 1.45;
    }
    .brief-list { display: grid; }
    .brief-row {
      padding: 13px 0;
      display: grid;
      grid-template-columns: 56px minmax(0,1fr);
      gap: 10px;
      border-bottom: 1px solid var(--phone-line);
      cursor: pointer;
    }
    .brief-row time { color: var(--phone-muted); font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .brief-row h5 { margin: 0; font-size: 12px; line-height: 1.4; }
    .brief-row p { margin: 5px 0 0; color: var(--phone-muted); font-size: 10px; line-height: 1.4; }

    .bottom-nav {
      padding: 8px 12px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      gap: 2px;
      border-top: 1px solid var(--phone-line);
      background: color-mix(in srgb, var(--phone-bg) 94%, transparent);
      backdrop-filter: blur(18px);
    }
    .bottom-nav button {
      min-height: 46px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: var(--phone-muted);
      font-size: 8px;
      cursor: pointer;
    }
    .bottom-nav button svg { width: 18px; height: 18px; }
    .bottom-nav button.active { color: var(--phone-accent); }

    .back-row { margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      border: 0;
      color: var(--phone-muted);
      background: transparent;
      font-size: 10px;
      cursor: pointer;
    }
    .back-button svg { width: 15px; }
    .detail-title { margin: 0 0 10px; font-size: 24px; line-height: 1.18; }
    .detail-deck { margin: 0; color: var(--phone-muted); font-size: 12px; line-height: 1.55; }
    .position-context {
      margin: 16px 0;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-block: 1px solid var(--phone-line);
    }
    .position-context div { min-width: 0; }
    .position-context span { display: block; color: var(--phone-muted); font-size: 8px; }
    .position-context strong { display: block; margin-top: 5px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .evidence-block { padding: 13px 0; border-bottom: 1px solid var(--phone-line); }
    .evidence-block header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .evidence-block h4 { margin: 0; font-size: 12px; }
    .evidence-block p { margin: 9px 0 0; color: var(--phone-muted); font-size: 10px; line-height: 1.5; }
    .source-row { margin-top: 10px; display: flex; align-items: center; gap: 9px; }
    .source-row .avatar { width: 31px; height: 31px; margin: 0; border-width: 0; }
    .source-row strong { display: block; font-size: 10px; }
    .source-row span { display: block; margin-top: 2px; color: var(--phone-muted); font-size: 9px; }
    .source-row button {
      margin-left: auto;
      padding: 6px 8px;
      border: 1px solid var(--phone-line);
      border-radius: 5px;
      color: var(--phone-text);
      background: var(--phone-surface);
      font-size: 9px;
      cursor: pointer;
    }
    .next-step { margin-top: 16px; padding: 12px; border-left: 3px solid var(--phone-accent); background: var(--phone-surface); }
    .next-step strong { display: block; font-size: 10px; }
    .next-step p { margin: 6px 0 0; color: var(--phone-muted); font-size: 10px; line-height: 1.5; }

    .subtabs {
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      border: 1px solid var(--phone-line);
      border-radius: 8px;
      background: var(--phone-surface);
    }
    .subtabs button { min-height: 34px; border: 0; border-radius: 5px; color: var(--phone-muted); background: transparent; font-size: 10px; font-weight: 700; cursor: pointer; }
    .subtabs button.active { color: var(--phone-accent-ink); background: var(--phone-accent); }
    .filter-bar { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .filter-bar p { margin: 0; color: var(--phone-muted); font-size: 9px; }
    .filter-button {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 9px;
      border: 1px solid var(--phone-line);
      border-radius: 6px;
      color: var(--phone-text);
      background: var(--phone-surface);
      font-size: 9px;
      cursor: pointer;
    }
    .filter-button svg { width: 13px; }
    .ranking { border-top: 1px solid var(--phone-line); }
    .rank-row {
      min-height: 76px;
      padding: 11px 0;
      display: grid;
      grid-template-columns: 25px 38px minmax(0,1fr) auto;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--phone-line);
      cursor: pointer;
    }
    .rank-num { color: var(--phone-muted); font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .rank-row .avatar { width: 38px; height: 38px; margin: 0; border: 0; }
    .rank-row h5 { margin: 0; font-size: 11px; }
    .rank-row p { margin: 4px 0 0; color: var(--phone-muted); font-size: 9px; }
    .rank-score { text-align: right; }
    .rank-score strong { display: block; color: var(--phone-accent); font: 800 15px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .wallet-avatar { display: grid !important; place-items: center; border-radius: 50%; background: #24453d !important; color: #8ff3d6; font: 800 9px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .mini-chart {
      height: 136px;
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--phone-line);
      border-radius: 8px;
      background: var(--phone-surface);

    .mini-chart path.price { fill: none; stroke: var(--phone-muted); stroke-width: 1.3; }
    .mini-chart path.signal { fill: none; stroke: var(--phone-accent); stroke-width: 2.4; }
    .mini-chart line { stroke: var(--phone-line); stroke-width: 1; }
    .mini-chart circle { fill: var(--phone-accent); stroke: var(--phone-surface); stroke-width: 2; }

    .position-list { border-top: 1px solid var(--phone-line); }
    .position-row { min-height: 62px; padding: 10px 0; display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--phone-line); }
    .position-row h5 { margin: 0; font-size: 11px; }
    .position-row p { margin: 4px 0 0; color: var(--phone-muted); font-size: 9px; }
    .position-row .value { text-align: right; }
    .position-row .value strong { display: block; font: 750 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .position-row .value span { display: block; margin-top: 3px; font-size: 9px; }
    .search-box { height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--phone-line); border-radius: 7px; background: var(--phone-surface); color: var(--phone-muted); }
    .search-box svg { width: 16px; }
    .search-box span { font-size: 11px; }
    .ticker-header { margin-top: 16px; display: flex; align-items: center; gap: 11px; }
    .ticker-header .ticker-mark { width: 46px; }
    .ticker-header h4 { margin: 0; font-size: 18px; }
    .ticker-header p { margin: 4px 0 0; color: var(--phone-muted); font-size: 9px; }

    .phone-sheet {
      position: absolute;
      z-index: 15;
      inset: 0;
      display: grid;
      align-items: end;
      background: rgba(0,0,0,.52);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ease);
    }
    .phone-sheet.open { opacity: 1; pointer-events: auto; }
    .sheet-panel {
      max-height: 62%;
      padding: 10px 16px 28px;
      border-top: 1px solid var(--phone-line);
      border-radius: 18px 18px 0 0;
      background: var(--phone-surface);
      transform: translateY(100%);
      transition: transform var(--ease);
    }

    .sheet-handle { width: 34px; height: 4px; margin: 0 auto 16px; border-radius: 2px; background: var(--phone-line); }
    .sheet-panel header { display: flex; align-items: center; justify-content: space-between; }
    .sheet-panel h4 { margin: 0; font-size: 15px; }
    .sheet-panel header button { border: 0; background: transparent; color: var(--phone-muted); cursor: pointer; }
    .sheet-option { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid var(--phone-line); background: transparent; color: var(--phone-text); font-size: 11px; cursor: pointer; }
    .sheet-option.active { color: var(--phone-accent); }

    .review-panel { padding-top: 76px; }

    .review-block li { position: relative; padding-left: 16px; color: #c6cfcc; font-size: 12px; line-height: 1.45; }
    .review-block li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
    .fit-row { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid #1c2321; font-size: 11px; }
    .fit-row span { color: var(--muted); }
    .fit-row strong { font-weight: 650; }
    .recommendation { margin-top: 22px; padding: 14px; border-left: 3px solid var(--brand); background: #111715; }
    .recommendation strong { display: block; font-size: 12px; }
    .recommendation p { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

    .toast {
      position: fixed;
      z-index: 60;
      left: 50%;
      bottom: 28px;
      min-width: 260px;
      max-width: calc(100vw - 32px);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #33413c;
      border-radius: 7px;
      color: #eaf1ef;
      background: #131a18;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);

      opacity: 0;

      transition: opacity var(--ease), transform var(--ease);

    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast svg { width: 15px; color: var(--brand); }

    @media (max-width: 1180px) {
      .control-band { grid-template-columns: 1fr 1fr; }
      .control-band .layout-toggle { display: none; }
      .prototype-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; }
      .direction-column { flex: 0 0 min(390px, calc(100vw - 64px)); scroll-snap-align: center; }
      .prototype-grid.focus { display: grid; grid-template-columns: minmax(390px,.8fr) minmax(340px,1.2fr); overflow: visible; }
    }
    @media (max-width: 780px) {
      .review-header { padding: 13px 16px; }
      .header-meta span:not(.prototype-label) { display: none; }
      .control-band { position: static; padding: 12px 16px; grid-template-columns: 1fr; }
      .scheme-switch button { padding: 5px 4px; font-size: 10px; line-height: 1.2; white-space: normal; }
      .scheme-switch button.active::before { width: 5px; height: 5px; margin-right: 3px; }
      .stage { padding: 20px 12px 34px; }
      .stage-heading { padding: 0 4px; }
      .stage-heading h1 { font-size: 17px; }

      .review-panel-inner { border-left: 0; border-top: 1px solid var(--line); padding: 22px 0 0; }
      .phone { height: min(844px, calc(100vh - 70px)); min-height: 690px; }

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }

</head>
<body>
  <div class="review-shell">

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">

  <script>

          <button class="sheet-option" data-action="apply-filter"><span>仅看已关注作者</span>${icon("chevron-right")}</button>
        </div>

    }

    function pulseToday() {
      return `<div class="phone-page">
        <div class="app-bar"><div><span class="eyebrow">Portfolio monitor</span><h3>早上好，Conor</h3><p>3 项变化与你的持仓有关</p></div>${notificationButton()}</div>

        <section class="evidence-block"><header><h4>Smart Account</h4><span class="relation-pill confirm">3 位转多</span></header><p>作者共识由中性转为偏多，变化主要来自 AI 数据中心需求与下一季度指引预期。</p><div class="source-row">${avatar("kevin", "Kevin Xu")}<div><strong>Kevin Xu · Score 86</strong><span>半导体 · 中线 · 12 分钟前</span></div><button data-action="source">原帖</button></div><div class="source-row">${avatar("serenity", "Serenity")}<div><strong>Serenity · Score 82</strong><span>科技 · 短中线 · 34 分钟前</span></div><button data-action="source">证据</button></div></section>
        <section class="evidence-block"><header><h4>Smart Money</h4><span class="relation-pill diverge">尚未确认</span></header><p>监测的 100 个公开账户中，NVDA 代币化合约净敞口过去 6 小时变化不足 2%。数据延迟约 10 分钟。</p></section>
        <section class="evidence-block"><header><h4>反方与限制</h4>${icon("info")}</header><p>社交观点可能先于资金，也可能只是短期情绪。链上永续仓位不等同于传统美股现货持仓。</p></section>
        <div class="next-step"><strong>下一步研究</strong><p>观察未来 6–12 小时公开账户是否开始增加多头敞口，并核对作者是否给出明确时间周期和失效条件。</p></div>
      </div>`;
    }

    function smartPage(scheme) {
      const isMoney = state.smartMode === "money";
      return `<div class="phone-page">
        <div class="app-bar"><div><span class="eyebrow">Tracked intelligence</span><h3>Smart</h3><p>聪明观点与公开资金</p></div><button class="icon-button" data-action="search" title="搜索">${icon("search")}</button></div>
        <div class="subtabs"><button class="${!isMoney ? "active" : ""}" data-action="smart-mode" data-mode="account">Smart Account</button><button class="${isMoney ? "active" : ""}" data-action="smart-mode" data-mode="money">Smart Money</button></div>
        <div class="filter-bar"><p>${isMoney ? "公开账户 · Hyperliquid" : "正式排名 · 前 25% Score"}</p><button class="filter-button" data-action="filter">${icon("sliders-horizontal")} 筛选</button></div>
        ${isMoney ? moneyRanking(scheme) : accountRanking(scheme)}
      </div>`;
    }

    function accountRanking(scheme) {
      const rows = [
        ["01", "kevin", "Kevin Xu", "AI · 半导体 · 中线", "92", "+4"],
        ["02", "serenity", "Serenity", "科技 · 短中线", "88", "+1"],
        ["03", "kitty", "Roaring Kitty", "事件驱动 · 短线", "85", "–"],
        ["04", "matt", "Matt Kohrs", "高波动 · 短线", "81", "+3"],
        ["05", "obi", "Obi", "软件 · 中线", "79", "−1"]
      ];
      return `<div class="ranking">${rows.map(([rank, key, name, meta, score, change]) => `<article class="rank-row" data-action="profile" tabindex="0"><span class="rank-num">${rank}</span>${avatar(key,name)}<div><h5>${name}</h5><p>${meta}</p></div><div class="rank-score"><strong>${score}</strong><span>${change} 本周</span></div></article>`).join("")}</div>`;
    }

    function moneyRanking(scheme) {
      const rows = [
        ["01", "0x7A…F3", "NVDA · MU · 净多头", "94", "+8"],
        ["02", "0x21…C8", "MSTR · 净多头", "90", "+2"],
        ["03", "0xB4…11", "NVDA · 双向", "86", "−1"],
        ["04", "0x0D…9A", "PLTR · 新开多仓", "82", "+6"],
        ["05", "0xE1…72", "MU · 减少空仓", "78", "+3"]
      ];
      return `<div class="ranking">${rows.map(([rank, name, meta, score, change]) => `<article class="rank-row" data-action="profile" tabindex="0"><span class="rank-num">${rank}</span><span class="avatar wallet-avatar">${name.slice(0,2)}</span><div><h5>${name}</h5><p>${meta}</p></div><div class="rank-score"><strong>${score}</strong><span>${change} 本周</span></div></article>`).join("")}</div>`;
    }

    function portfolioPage(scheme) {
      return `<div class="phone-page">
        <div class="app-bar"><div><span class="eyebrow">Portfolio</span><h3>你的持仓</h3><p>只展示会影响事件优先级的信息</p></div><button class="icon-button" data-action="notify" title="添加持仓">${icon("plus")}</button></div>
        <div class="metric-row"><div class="metric"><span>已填持仓</span><strong>4</strong></div><div class="metric"><span>总权重</span><strong>82%</strong></div><div class="metric"><span>未读事件</span><strong class="negative">3</strong></div></div>
        <div class="mini-chart"><header><strong>持仓影响概览</strong><span>最近 30 天</span></header><svg viewBox="0 0 320 86" aria-label="组合走势示意图"><line x1="0" y1="70" x2="320" y2="70"></line><line x1="0" y1="35" x2="320" y2="35"></line><path class="price" d="M0 68 C30 62,45 74,72 58 S118 46,142 54 S190 64,212 41 S257 34,320 18"></path><path class="signal" d="M0 72 C32 69,52 66,78 61 S120 56,150 58 S192 49,218 45 S270 27,320 22"></path><circle cx="218" cy="45" r="4"></circle></svg></div>
        <div class="section-title"><h4>当前持仓</h4><span>按仓位排序</span></div>
        <div class="position-list">
          ${positionRow("NVDA", "NVIDIA", "18% · 成本 $102.40", "$130.16", "+27.1%", "3")}
          ${positionRow("MU", "Micron", "16% · 成本 $121.80", "$126.20", "+3.6%", "1")}
          ${positionRow("MSTR", "Strategy", "12% · 成本 $1,092", "$1,034", "−5.3%", "2")}
          ${positionRow("PLTR", "Palantir", "8% · 成本 $141.20", "$146.88", "+4.0%", "0")}
        </div>
      </div>`;
    }

    function positionRow(ticker, name, meta, price, change, events) {
      return `<div class="position-row"><span class="ticker-mark">${ticker}</span><div><h5>${name}</h5><p>${meta} · ${events} 个事件</p></div><div class="value"><strong>${price}</strong><span class="${change.startsWith("−") ? "negative" : "positive"}">${change}</span></div></div>`;
    }

    function researchPage(scheme) {
      return `<div class="phone-page">
        <div class="app-bar"><div><span class="eyebrow">Research</span><h3>研究</h3><p>从标的进入精选证据，而不是全量 Feed</p></div>${notificationButton()}</div>
        <div class="search-box">${icon("search")}<span>搜索股票，如 NVDA</span></div>
        <div class="ticker-header"><span class="ticker-mark">NVDA</span><div><h4>NVIDIA</h4><p>NASDAQ · 你持有 18% · Smart Money 可用</p></div></div>
        <div class="mini-chart"><header><strong>$130.16</strong><span class="positive">+2.8% · 1M</span></header><svg viewBox="0 0 320 86" aria-label="NVDA 价格与观点变化"><line x1="0" y1="70" x2="320" y2="70"></line><line x1="0" y1="35" x2="320" y2="35"></line><path class="price" d="M0 65 C20 69,34 52,56 57 S94 72,118 56 S158 35,184 43 S226 62,250 39 S285 26,320 18"></path><path class="signal" d="M0 72 C55 70,94 67,120 65 S175 60,208 51 S270 33,320 24"></path><circle cx="250" cy="39" r="4"></circle></svg></div>
        <div class="section-title"><h4>当前判断</h4><span>更新于 2 分钟前</span></div>
        <article class="pulse-hero" data-action="event" tabindex="0"><div class="event-meta"><span>SMART INTELLIGENCE</span><span class="relation-pill diverge">观点领先</span></div><h4 style="font-size:17px">作者转多，资金暂未确认</h4><p>高分作者的预期明显提高，但公开资金的多头敞口仍然平稳。</p></article>
        <div class="section-title"><h4>最近一个月证据</h4><span>精选 6 条</span></div>
        <div class="event-list">${eventRow("SA", "Kevin Xu 提高目标区间", "Score 92 · 中线判断", "12m", "confirm")}${eventRow("SM", "公开账户净敞口持平", "100 个账户 · 10m 延迟", "18m", "diverge")}</div>
      </div>`;
    }

    function profilePage(scheme) {
      const money = state.smartMode === "money";
      return `<div class="phone-page"><div class="back-row"><button class="back-button" data-action="back-smart">${icon("chevron-left")} 返回榜单</button><span class="small-pill">${money ? "Smart Money" : "Smart Account"}</span></div>
        <div class="source-row" style="margin-top:6px">${money ? '<span class="avatar wallet-avatar">0x</span>' : avatar("kevin","Kevin Xu")}<div><strong style="font-size:15px">${money ? "0x7A…F3" : "Kevin Xu"}</strong><span>${money ? "公开账户 · Hyperliquid" : "@kevinxu · X · Score 前 3%"}</span></div><div class="rank-score"><strong>${money ? "94" : "92"}</strong><span>Score</span></div></div>
        <div class="metric-row" style="margin-top:16px"><div class="metric"><span>${money ? "30D PnL" : "有效判断"}</span><strong>${money ? "+18.4%" : "48"}</strong></div><div class="metric"><span>${money ? "当前仓位" : "胜率"}</span><strong>${money ? "4" : "67%"}</strong></div><div class="metric"><span>${money ? "最大回撤" : "N_eff"}</span><strong>${money ? "−8.1%" : "31"}</strong></div></div>
        <div class="mini-chart"><header><strong>${money ? "账户净值与仓位动作" : "观点 + 标的价格证据"}</strong><span>最近 30 天</span></header><svg viewBox="0 0 320 86"><line x1="0" y1="70" x2="320" y2="70"></line><line x1="0" y1="35" x2="320" y2="35"></line><path class="price" d="M0 68 C38 63,50 70,82 55 S126 47,154 52 S207 46,232 31 S275 37,320 15"></path><path class="signal" d="M0 72 L54 70 L82 61 L126 60 L154 56 L207 50 L232 34 L275 28 L320 21"></path><circle cx="82" cy="61" r="4"></circle><circle cx="232" cy="34" r="4"></circle></svg></div>
        <div class="section-title"><h4>${money ? "最近资金动作" : "最近观点"}</h4><span>全部证据可追溯</span></div>
        <div class="timeline"><article class="timeline-item"><small>今天 · NVDA</small><h5>${money ? "多头仓位保持不变" : "提高中期目标区间"}</h5><p>${money ? "未跟随社交观点继续加仓。" : "数据中心需求仍是主要依据。"}</p></article><article class="timeline-item risk"><small>3 天前 · MSTR</small><h5>${money ? "减少多头敞口 18%" : "下调短期风险偏好"}</h5><p>原始证据和结算窗口均可查看。</p></article></div>
      </div>`;
    }

    function appContent(scheme) {
      if (state.screen === "event") return eventDetail(scheme);
      if (state.screen === "smart-profile") return profilePage(scheme);
      if (state.screen === "smart") return smartPage(scheme);
      if (state.screen === "portfolio") return portfolioPage(scheme);
      if (state.screen === "research") return researchPage(scheme);
      if (scheme === "grid") return gridToday();
      if (scheme === "brief") return briefToday();
      return pulseToday();
    }

    function phonePrototype(scheme) {
      const active = state.screen === "smart-profile" ? "smart" : state.screen;
      return `<div class="phone" data-scheme="${scheme}">${statusBar()}<div class="screen"><div class="screen-scroll">${appContent(scheme)}</div>${bottomNav(active)}</div>${phoneSheet()}</div>`;
    }

    function directionColumn(scheme) {
      const item = directions[scheme];
      return `<section class="direction-column"><div class="direction-heading"><div><h2>${item.name}</h2><p>${item.subtitle}</p></div><span class="direction-number">${item.number}</span></div><div class="phone-wrap">${phonePrototype(scheme)}</div></section>`;
    }

    function reviewPanel(scheme) {
      const item = directions[scheme];
      return `<aside class="review-panel"><div class="review-panel-inner"><span class="eyebrow">Direction ${item.number}</span><h2>${item.name}</h2><p>${item.description}</p><div class="review-block"><h3>核心原则</h3><ul>${item.principles.map(x => `<li>${x}</li>`).join("")}</ul></div><div class="review-block"><h3>适用性</h3><div class="fit-row"><span>主要参考</span><strong>${item.source}</strong></div><div class="fit-row"><span>最适合</span><strong>${item.best}</strong></div><div class="fit-row"><span>主要风险</span><strong>${item.risk}</strong></div></div><div class="recommendation"><strong>bSmart 建议</strong><p>${item.recommendation}</p></div></div></aside>`;
    }

    function render() {
      const grid = document.getElementById("prototypeGrid");
      if (state.layout === "compare") {
        grid.className = "prototype-grid";
        grid.innerHTML = ["pulse", "grid", "brief"].map(directionColumn).join("");
        document.getElementById("stageTitle").textContent = "三套方向并排比较";
        document.getElementById("stageDescription").textContent = "点击事件卡、底部 Tab 或筛选按钮体验完整路径。三套方向使用相同信息，差异只来自信息层级与视觉语言。";
      } else {
        grid.className = "prototype-grid focus";
        grid.innerHTML = directionColumn(state.scheme) + reviewPanel(state.scheme);
        document.getElementById("stageTitle").textContent = directions[state.scheme].name + " · 聚焦评审";
        document.getElementById("stageDescription").textContent = directions[state.scheme].description;
      }
      document.querySelectorAll("#schemeSwitch button").forEach(button => button.classList.toggle("active", button.dataset.scheme === state.scheme));
      document.querySelectorAll("#screenSwitch button").forEach(button => button.classList.toggle("active", button.dataset.screen === (state.screen === "smart-profile" ? "smart" : state.screen)));
      const layoutButton = document.getElementById("layoutToggle");
      layoutButton.innerHTML = state.layout === "compare" ? `${icon("columns-3")}<span>三案对比</span>` : `${icon("maximize-2")}<span>聚焦评审</span>`;
      if (window.lucide) window.lucide.createIcons();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.querySelector("span").textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.addEventListener("click", (event) => {
      const schemeButton = event.target.closest("[data-scheme]");
      if (schemeButton && schemeButton.closest("#schemeSwitch")) {
        state.scheme = schemeButton.dataset.scheme;
        state.layout = "focus";
        render();
        return;
      }
      const screenButton = event.target.closest("#screenSwitch [data-screen]");
      if (screenButton) {
        state.screen = screenButton.dataset.screen;
        state.sheetOpen = false;
        render();
        return;
      }
      if (event.target.closest("#layoutToggle")) {
        state.layout = state.layout === "compare" ? "focus" : "compare";
        render();
        return;
      }
      const actionTarget = event.target.closest("[data-action]");
      if (!actionTarget) return;
      const action = actionTarget.dataset.action;
      if (action === "screen") state.screen = actionTarget.dataset.screen;
      if (action === "event") state.screen = "event";
      if (action === "back") state.screen = "today";
      if (action === "back-smart") state.screen = "smart";
      if (action === "profile") state.screen = "smart-profile";
      if (action === "smart-mode") { state.smartMode = actionTarget.dataset.mode; state.screen = "smart"; }
      if (action === "filter") state.sheetOpen = true;
      if (action === "close-sheet") state.sheetOpen = false;
      if (action === "apply-filter") { state.sheetOpen = false; showToast("筛选已应用：前 25% Score"); }
      if (action === "source") showToast("正式产品中将打开原帖或链上证据");
      if (action === "notify") showToast("通知设置将在底部 Sheet 中打开");
      if (action === "search") showToast("搜索作者、账户或标的");
      render();
    });

    document.addEventListener("keydown", (event) => {
      if ((event.key === "Enter" || event.key === " ") && event.target.matches('[data-action="event"], [data-action="profile"]')) event.target.click();
    });

    render();
  </script>
</body>
</html>
