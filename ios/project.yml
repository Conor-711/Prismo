name: bSmart

options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  InternalAlpha: release
  Release: release

packages:
  MessagePack:
    path: Packages/MessagePack
  BigInt:
    url: https://github.com/attaswift/BigInt
    exactVersion: 5.7.0
  WalletCore:
    path: Packages/WalletCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  BSmart:
    type: application
    platform: iOS
    info:
      path: BSmart/Supporting/Info.plist
      properties:
        CFBundleDisplayName: bSmart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: today.bsmart.signal
            CFBundleURLSchemes:
              - bsmart
          - CFBundleTypeRole: Editor
            CFBundleURLName: today.bsmart.google-signin
            CFBundleURLSchemes:
              - $(BSMART_GOOGLE_REVERSED_CLIENT_ID)
        BSMART_GOOGLE_IOS_CLIENT_ID: $(BSMART_GOOGLE_IOS_CLIENT_ID)
        BSMART_GOOGLE_SERVER_CLIENT_ID: $(BSMART_GOOGLE_SERVER_CLIENT_ID)
        BSMART_APPLE_SIGN_IN_ENABLED: $(BSMART_APPLE_SIGN_IN_ENABLED)
        BSMART_INTERNAL_OPTIONAL_WALLET_BACKUP: $(BSMART_INTERNAL_OPTIONAL_WALLET_BACKUP)
        BSMART_SUPABASE_URL: $(BSMART_SUPABASE_URL)
        BSMART_SUPABASE_PUBLISHABLE_KEY: $(BSMART_SUPABASE_PUBLISHABLE_KEY)
        NSFaceIDUsageDescription: Unlock your wallet and protect your recovery phrase.
        BSMART_API_BASE_URL: $(BSMART_ENDPOINT_URL)
        BSMART_DATA_ENVIRONMENT: $(BSMART_DATA_ENVIRONMENT)
        BSMART_DEEPSEEK_API_KEY: $(BSMART_DEEPSEEK_API_KEY)
        BSMART_DEEPSEEK_BASE_URL: $(BSMART_DEEPSEEK_BASE_URL)
        BSMART_MR_COLLIE_MODEL: $(BSMART_MR_COLLIE_MODEL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
    sources:
      - path: BSmart
      - path: Packages/MessagePack/LICENSE
        buildPhase: resources
      - path: ../contracts/fixtures
        buildPhase: resources
    dependencies:
      - package: MessagePack
        product: MessagePack
      - package: BigInt
        product: BigInt
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.bsmart.ios
        PRODUCT_NAME: BSmart
        PRODUCT_MODULE_NAME: BSmart
        BSMART_GOOGLE_IOS_CLIENT_ID: 1063849277830-g10kodb6nu1s29k9sfi3ije6arfegckj.apps.googleusercontent.com
        BSMART_GOOGLE_SERVER_CLIENT_ID: 1063849277830-6iqp8kf99tbmlhvfakh081f6no2gafuk.apps.googleusercontent.com
        BSMART_GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1063849277830-g10kodb6nu1s29k9sfi3ije6arfegckj
        BSMART_APPLE_SIGN_IN_ENABLED: "NO"
        # This build is internal-only. Set NO before public distribution.
        BSMART_INTERNAL_OPTIONAL_WALLET_BACKUP: "YES"
        BSMART_SUPABASE_URL: https://dzyitinagewdfkzjkuiz.supabase.co
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 6
        APS_ENVIRONMENT: development
        BSMART_ENDPOINT_URL: https://api.bsmart.today
        BSMART_DATA_ENVIRONMENT: production
        BSMART_DEEPSEEK_BASE_URL: https://api.deepseek.com
        BSMART_MR_COLLIE_MODEL: deepseek-v4-flash
        CODE_SIGN_ENTITLEMENTS: BSmart/Supporting/BSmart.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: bSmart
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
        DEVELOPMENT_ASSET_PATHS: "$(SRCROOT)/../contracts/fixtures"
      configs:
        Debug:
          BSMART_ENDPOINT_URL: http://127.0.0.1:8081
          BSMART_DATA_ENVIRONMENT: production
        InternalAlpha:
          APS_ENVIRONMENT: development
          EXCLUDED_SOURCE_FILE_NAMES: "*.json"
          BSMART_ENDPOINT_URL: https://api.158-247-196-93.sslip.io
          BSMART_DATA_ENVIRONMENT: production
        Release:
          APS_ENVIRONMENT: production
          BSMART_ENDPOINT_URL: https://api.bsmart.today
          BSMART_DATA_ENVIRONMENT: production
    configFiles:
      Debug: Config/Base.xcconfig
      InternalAlpha: Config/Base.xcconfig
      Release: Config/Base.xcconfig
  BSmartTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BSmartTests
    dependencies:
      - target: BSmart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.bsmart.ios.tests
        GENERATE_INFOPLIST_FILE: true
  BSmartUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BSmartUITests
    dependencies:
      - target: BSmart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.bsmart.ios.ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BSmart

schemes:
  bSmart:
    build:
      targets:
        BSmart: all
        BSmartTests: [test]
        BSmartUITests: [test]
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - BSmartTests
        - BSmartUITests
  bSmart Internal Alpha:
    build:
      targets:
        BSmart: all
    run:
      config: InternalAlpha
    profile:
      config: InternalAlpha
    archive:
      config: InternalAlpha
  bSmart Local:
    build:
      targets:
        BSmart: all
    run:
      config: Debug
      environmentVariables:
        BSMART_USE_LIVE_API: "1"
        BSMART_API_BASE_URL: http://localhost:8081
        BSMART_DATA_ENVIRONMENT: development
