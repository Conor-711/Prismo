services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?required}
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ../../data/runtime/telegram-bot-api:/var/lib/telegram-bot-api
